schema_version: 1

context:
  name: langchain-qdrant
  version: 1.2.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_qdrant-${{ version }}.tar.gz
  sha256: 073499ab82e68bb5019b02a3c458c3659af1e17b55bb9c480526d392947c807e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - pydantic >=2.7.4
    - langchain-core >=1.4.7,<2.0.0
    - qdrant-client >=1.15.1,<1.16.0
tests:
  - python:
      imports:
        - langchain_qdrant
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting Qdrant and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - jan-janssen
